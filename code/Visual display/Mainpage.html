<!DOCTYPE html>
<html>
    <head>
        <title>POBS Dashboard</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <script type="importmap">
          {
            "imports": {
              "@material/web/": "https://esm.run/@material/web/"
            }
          }
        </script>
        <script type="module">
          import '@material/web/all.js';
          import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
      
          document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
        </script>
      </head>
      <body>
        <h1 class="md-typescale-display-medium">Hello Material!</h1>
        <div class="datagrid">   
            <div class="thrusterdata">
                <p>Thruster 1 output</p>
                <p>Thruster 2 output</p>
                <p>Thruster 3 output</p>
                <p>Thruster 4 output</p>
                
            </div>
            <div class="positiondata">
                <p>Rotation</p>
                <p>Location</p>
                <button>Reset</button>
                <button>Pause</button>
                <p>Drag</p>
                <p>Speed</p>
            </div>
            <div class="powerdata">
                <p>Estimated power draw</p>
                <p>Estimated battery life at recent power draw</p>
            </div>
        </div>
        <div class="modifyableata">
            <div>
                <p>Weight</p>
                <p>Volume</p>
                <p>Number of batteries</p>
            </div>
        </div>
        <div class="controlboard">
            <div>
                <input type="checkbox" id="roll">
                <md-outlined-text-field label="Induced roll"></md-outlined-text-field>
            </div>
            <div>
                <input type="checkbox" id="pitch">
                <md-outlined-text-field label="Induced pitch"></md-outlined-text-field>
            </div>
            <div>
                <input type="checkbox" id="yaw">
                <md-outlined-text-field label="Induced yaw"></md-outlined-text-field>
            </div>
            <div>
                <input type="checkbox" id="current">
                <md-outlined-text-field label="Directional current"></md-outlined-text-field>
            </div>
            <div>
                <md-outlined-text-field label="Drag coefficient"></md-outlined-text-field>
            </div>
        </div>
      </body>
</html>
